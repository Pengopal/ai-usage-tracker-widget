name: Release
# Push a tag like v1.3.0 to publish one GitHub release for every platform:
# the Windows installer (desktop/) and the Android APK (android/). The tag must
# match desktop/package.json and android/gradle.properties. Installed apps
# update from that release.
#
# The release starts as a private draft with the CHANGELOG.md notes. Each
# platform uploads its files to that draft, and it is published (and marked
# latest) only once every file is there, so the updaters never see a release
# with missing files. Re-running a failed run reuses the same draft.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches every platform's version
        run: |
          desktop="v$(node -p "require('./desktop/package.json').version")"
          android="v$(sed -n 's/^appVersion=//p' android/gradle.properties)"
          test "$desktop" = "$GITHUB_REF_NAME" || { echo "::error::Tag $GITHUB_REF_NAME does not match desktop/package.json $desktop"; exit 1; }
          test "$android" = "$GITHUB_REF_NAME" || { echo "::error::Tag $GITHUB_REF_NAME does not match android/gradle.properties $android"; exit 1; }

  draft:
    needs: versions
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Create the draft release with notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Plain string matching (no regex), so the brackets need no escaping.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = "true" || { echo "::error::$GITHUB_REF_NAME is already published"; exit 1; }
            echo "Reusing the existing draft"
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi

  desktop:
    needs: draft
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional code signing (see docs/desktop/CODE-SIGNING.md). Builds stay
      # unsigned until these secrets and variables exist.
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      SIGN_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      SIGN_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      SIGN_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      SIGN_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test

      - name: Build
        run: |
          # electron-builder only builds; the files are uploaded below. Its own
          # publishing uploads in parallel and can create duplicate releases.
          args=(--win --publish never)
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$SIGN_ENDPOINT" ]; then
            echo "Signing with Azure Artifact Signing"
            args+=(
              "-c.win.azureSignOptions.endpoint=$SIGN_ENDPOINT"
              "-c.win.azureSignOptions.codeSigningAccountName=$SIGN_ACCOUNT"
              "-c.win.azureSignOptions.certificateProfileName=$SIGN_PROFILE"
              "-c.win.azureSignOptions.publisherName=$SIGN_PUBLISHER"
            )
          else
            echo "::warning::No signing secrets set; the installer will be unsigned"
          fi
          npm run copy-core
          npx electron-builder "${args[@]}"

      - name: Upload to the draft
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" --clobber             "dist/AI-Usage-Tracker-Setup-$version.exe"             "dist/AI-Usage-Tracker-Setup-$version.exe.blockmap"             "dist/AI-Usage-Tracker-Portable-$version.exe"             dist/latest.yml

  android:
    needs: draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Skip without a signing key
        id: key
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; no APK is attached (see docs/android/README.md)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - uses: actions/checkout@v7
        if: steps.key.outputs.ok == 'true'
      - uses: actions/setup-java@v6
        if: steps.key.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: steps.key.outputs.ok == 'true'
      - name: Build the signed APK
        if: steps.key.outputs.ok == 'true'
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ./gradlew --no-daemon testGithubDebugUnitTest assembleGithubRelease
          rm -f "$ANDROID_KEYSTORE_PATH"
      - name: Upload to the draft
        if: steps.key.outputs.ok == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="app/build/outputs/apk/github/release/app-github-release.apk"
          test -f "$apk" || { echo "::error::Signed APK not found at $apk"; exit 1; }
          cp "$apk" "AI-Usage-Tracker-$version.apk"
          gh release upload "$GITHUB_REF_NAME" "AI-Usage-Tracker-$version.apk" --clobber

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HAS_ANDROID_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check every file is on the draft, then publish it
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          want="AI-Usage-Tracker-Setup-$version.exe AI-Usage-Tracker-Setup-$version.exe.blockmap AI-Usage-Tracker-Portable-$version.exe latest.yml"
          if [ "$HAS_ANDROID_KEY" = "true" ]; then want="$want AI-Usage-Tracker-$version.apk"; fi
          for f in $want; do
            grep -qxF "$f" <<<"$assets" || { echo "::error::$f is missing from the draft"; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
