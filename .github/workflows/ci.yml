name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run copy-core
      - name: Syntax-check the Electron code
        run: for f in src/*.js src/renderer/*.js; do node --check "$f"; done
      - run: npm test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon testGithubDebugUnitTest assembleGithubDebug assemblePlayDebug

  # The branch ruleset requires a check named "test": it passes only when every platform does.
  test:
    runs-on: ubuntu-latest
    needs: [core, desktop, android]
    if: always()
    steps:
      - name: All platforms passed
        run: |
          test "${{ needs.core.result }}" = success
          test "${{ needs.desktop.result }}" = success
          test "${{ needs.android.result }}" = success
